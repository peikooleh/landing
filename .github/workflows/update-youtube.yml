name: Update YouTube content

on:
  push:
    branches: [main, master]
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    # Prevent a commit made by this workflow from recursively starting another update.
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install YouTube extractor
        run: python -m pip install --upgrade yt-dlp

      - name: Refresh YouTube data
        run: python scripts/update_youtube.py

      - name: Commit changed YouTube data
        run: |
          if git diff --quiet -- assets/data/youtube.json; then
            echo "No YouTube changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/data/youtube.json
          git commit -m "chore: update YouTube videos"
          git push
